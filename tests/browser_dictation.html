<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Voice Typer Browser Test</title>
<style>body{font:20px system-ui;max-width:760px;margin:50px auto;padding:20px}textarea{width:100%;height:160px;font:20px system-ui;padding:16px;box-sizing:border-box}#status{color:#2563eb}</style></head>
<body><h1>Voice Typer Browser Test</h1><p>Click the field, then use Voice Typer normally.</p>
<textarea id="dictation" autofocus aria-label="Dictation test field" placeholder="Dictation appears here"></textarea>
<p id="status">Waiting for input</p>
<script>const field=document.querySelector('#dictation');field.addEventListener('input',()=>{document.querySelector('#status').textContent=`Received ${field.value.length} characters`;});field.focus();</script>
</body></html>
